[project]
name = "recruit-intel"
version = "0.1.0"
description = "Club-agnostic football recruitment and squad-analysis platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.9",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Models (`recruit train | similar | roles | bargains`). For CPU-only torch:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["torch>=2.4", "scikit-learn>=1.5", "joblib>=1.4"]
# Dashboard API: `uvicorn recruit_intel.api.main:app --port 8000`
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# Post images and videos (`python -m showcase.render`); then `playwright install chromium`
showcase = ["playwright>=1.45", "imageio-ffmpeg>=0.5"]

[project.scripts]
recruit = "recruit_intel.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recruit_intel*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real data sources over the network (deselect with -m 'not live')",
    "uses_trained_models: lets the test see models trained into data/models/",
]
