# Formation library. A club config picks one by key and may override the role
# of any slot in its own `roles:` map.
#
# Each slot lists the position groups that can fill it (GK, CB, FB, DM, CM,
# AM, W, ST; see recruit_intel/features/positions.py), its default role from
# config/roles.yaml, and pitch coordinates for the lineup builder (x: 0 left
# touchline to 100 right; y: 0 own goal line to 100 opponent's).

4-2-3-1:
  GK:  {groups: [GK],     role: sweeper_keeper,     x: 50, y: 5}
  RB:  {groups: [FB],     role: attacking_wingback, x: 88, y: 27}
  RCB: {groups: [CB],     role: ball_playing_cb,    x: 63, y: 20}
  LCB: {groups: [CB],     role: stopper_cb,         x: 37, y: 20}
  LB:  {groups: [FB],     role: attacking_wingback, x: 12, y: 27}
  DM:  {groups: [DM, CM], role: deep_playmaker,     x: 40, y: 42}
  CM:  {groups: [CM, DM], role: box_to_box,         x: 60, y: 45}
  RW:  {groups: [W, AM],  role: inside_forward,     x: 85, y: 68}
  AM:  {groups: [AM, CM], role: creative_10,        x: 50, y: 66}
  LW:  {groups: [W, AM],  role: inside_forward,     x: 15, y: 68}
  ST:  {groups: [ST],     role: complete_forward,   x: 50, y: 86}

