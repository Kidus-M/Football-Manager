# Tactics layer configuration. Rule-based: it encodes football reasoning over
# the squad's percentiles, it is not a trained model. Edit freely.

# Tactical settings (the "sliders"). Each option reweights the roles of the
# listed position groups: a metric's weight is multiplied; a metric a role
# doesn't use yet is added at `added_weight` x (multiplier - 1) when the
# multiplier is above 1. `recruit tactics --press high` re-runs the best XI
# and gap report under the reweighted roles.
added_weight: 0.15
settings:
  press:
    high: {groups: [ST, W, AM, CM, DM], boost: {tackles: 2.0, interceptions: 1.6, duels_won: 1.6, recoveries: 2.0}}
    low: {groups: [ST, W, AM, CM, DM], boost: {tackles: 0.5, interceptions: 0.7, duels_won: 0.7, recoveries: 0.5}}
  buildup:
    short: {groups: [GK, CB, FB, DM], boost: {xg_buildup: 2.0}}
    direct: {groups: [GK, CB, FB, DM], boost: {xg_buildup: 0.3, blocks: 1.5, duels_won: 1.5}}
  width:
    wide: {groups: [FB, W], boost: {xa: 1.6, key_passes: 1.6}}
    narrow: {groups: [AM, CM], boost: {xa: 1.6, key_passes: 1.6, npxg: 1.3}}

# Team levers: which XI slots' percentiles say what the squad is suited to.
# Thresholds are percentiles against league peers in the same position group.
levers:
  press:
    slots_groups: [ST, W, AM, CM, DM]
    metrics: [tackles, interceptions, duels_won, recoveries]
    high_at: 60
    low_at: 40
  buildup:
    slots_groups: [GK, CB, DM]
    metrics: [xg_buildup]
    high_at: 60
    low_at: 40
  finishing:
    slots_groups: [ST]
    metrics: [npxg, shots]
    high_at: 60
    low_at: 40

# Per-position instructions. A rule fires for a starter in one of `groups`
# when every condition holds (metric percentile >= or <= the number).
# `{name}` is replaced by the player's name. `once: true` gives a job only one
# player can do (e.g. dropping between the centre-backs) to the strongest
# qualifying starter only.
instructions:
  - groups: [GK]
    when: {xg_buildup: ">=65"}
    once: true
    say: "{name} can be the spare man in build-up: play out from goal kicks"
  - groups: [GK]
    when: {xg_buildup: "<=35"}
    say: "{name} is not a build-up outlet: build through the centre-backs or go long under pressure"
  - groups: [CB]
    when: {xg_buildup: ">=65"}
    once: true
    say: "{name} starts attacks: let him carry or split wide in the first phase"
  - groups: [CB]
    when: {xg_buildup: "<=30"}
    say: "{name} should keep it simple: short passes to the holding midfielder"
  - groups: [CB]
    when: {interceptions: "<=30", blocks: "<=35", tackles: "<=40"}
    say: "{name} is exposed defending his box: protect him with a deeper line or a screening midfielder"
  - groups: [FB]
    when: {xa: ">=65"}
    say: "{name} creates from wide: push him high and have the nearest midfielder cover"
  - groups: [FB]
    when: {xa: "<=35", tackles: ">=60"}
    say: "{name} is a defensive full-back: keep him deeper and let the winger hold the width"
  - groups: [FB]
    when: {duels_won: "<=25"}
    say: "{name} loses too many duels: keep a midfielder close to double up"
  - groups: [DM, CM]
    when: {interceptions: ">=75"}
    say: "{name} reads the game: let him hold the space in front of the back line"
  - groups: [DM, CM]
    when: {recoveries: ">=70"}
    say: "{name} wins the ball back: use him to screen and to step into the press"
  - groups: [DM, CM]
    when: {xg_buildup: ">=70"}
    once: true
    say: "{name} dictates play: drop him between the centre-backs to start possession"
  - groups: [CM, AM]
    when: {npxg: ">=70"}
    say: "{name} arrives in the box: license late runs beyond the striker"
  - groups: [CM, AM]
    when: {key_passes: ">=70"}
    once: true
    say: "{name} is the creator: free him in the half-spaces between the lines"
  - groups: [W]
    when: {npxg: ">=70", shots: ">=65"}
    say: "{name} is a goal threat: play him on the inside foot, attacking the back post"
  - groups: [W]
    when: {xa: ">=70"}
    say: "{name} is a provider: keep him wide to deliver for the striker"
  - groups: [W, AM]
    when: {tackles: ">=70"}
    say: "{name} presses well: let him trigger the press on the opposing full-back"
  - groups: [W]
    when: {tackles: "<=25"}
    say: "{name} contributes little out of possession: shield him with a hard-working full-back"
  - groups: [ST]
    when: {npxg: ">=70", xa: "<=40"}
    say: "{name} is a finisher: keep him central and feed the box early"
  - groups: [ST]
    when: {xa: ">=65"}
    say: "{name} links play: let him drop and send runners beyond him"
  - groups: [ST]
    when: {npxg: "<=35"}
    say: "{name} gets few chances: more support in the box (wide forwards attacking the far post)"
